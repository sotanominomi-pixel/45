<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>N Clock — NClock</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="header">
      <h1 class="title">N Clock</h1>
    </header>

    <main class="main">
      <!-- Display -->
      <div id="display" class="time-display">00:00</div>

      <!-- Slider (clock only) -->
      <div id="sliderBox" class="slider-box">
        <div class="label-row">
          <div id="labelLeft" class="label-left">1日の長さ</div>
          <div id="labelHours" class="label-right">24 時間</div>
        </div>
        <input id="sliderHours" type="range" min="12" max="48" step="1" value="24">
      </div>

      <!-- mode tabs -->
      <nav class="tabs">
        <button id="tabClock" class="tab active">時計</button>
        <button id="tabStopwatch" class="tab">ストップウォッチ</button>
        <button id="tabAlarm" class="tab">アラーム</button>
        <button id="tabSettings" class="tab">設定</button>
      </nav>

      <!-- stopwatch area -->
      <section id="stopwatchArea" class="panel" style="display:none;">
        <div class="controls">
          <button id="swStart" class="btn-circle btn-start">Start</button>
          <button id="swLap" class="btn-rect mono" disabled>Lap</button>
          <button id="swReset" class="btn-rect mono" disabled>Reset</button>
        </div>
        <div id="lapList" class="lap-list"></div>
      </section>

      <!-- alarm area -->
      <section id="alarmArea" class="panel" style="display:none;">
        <div class="alarm-controls">
          <input id="alarmTime" type="time" step="60">
          <button id="alarmSetBtn" class="btn-large mono">アラーム追加</button>
        </div>
        <div id="alarmsContainer" class="alarms-container"></div>
      </section>

      <!-- settings area -->
      <section id="settingsArea" class="panel" style="display:none;">
        <div class="settings-row">
          <label>秒数表示</label>
          <label class="switch">
            <input id="secondsToggle" type="checkbox">
            <span class="slider-switch"></span>
          </label>
        </div>
      </section>

    </main>

    <footer class="footer">設定は自動で保存されます。</footer>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
